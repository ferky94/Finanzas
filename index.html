  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg:#0f1117;--bg2:#181b24;--bg3:#1f2330;--card:#242838;--border:#2e3347;
      --accent:#6c63ff;--accent2:#4ecdc4;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b;
      --text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;--radius:16px;--radius-sm:10px;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;overscroll-behavior:none}
    #app{display:flex;flex-direction:column;height:100dvh;max-width:430px;margin:0 auto;position:relative}
    #header{padding:52px 20px 16px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0}
    #content{flex:1;overflow-y:auto;padding:16px;padding-bottom:90px}
    #nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--bg2);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
    .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
    .header-title{font-size:13px;color:var(--text2);font-weight:500;letter-spacing:.5px;text-transform:uppercase}
    .header-date{font-size:12px;color:var(--text3)}
    .total-disponible{font-size:36px;font-weight:700;letter-spacing:-1px;color:var(--text)}
    .total-label{font-size:12px;color:var(--text3);margin-top:2px}
    .sync-status{font-size:10px;margin-top:4px;display:flex;align-items:center;gap:4px}
    .sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
    .sync-dot.syncing{background:var(--yellow);animation:pulse 1s infinite}
    .sync-dot.error{background:var(--red)}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 8px;border:none;background:none;color:var(--text3);font-size:10px;font-weight:500;cursor:pointer;transition:color .2s}
    .nav-btn svg{width:22px;height:22px}
    .nav-btn.active{color:var(--accent)}
    .nav-btn.active svg{stroke:var(--accent)}
    #fab{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));right:20px;width:56px;height:56px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 20px rgba(108,99,255,.5);z-index:99;transition:transform .15s}
    #fab:active{transform:scale(.93)}
    .card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid var(--border)}
    .card-row{display:flex;justify-content:space-between;align-items:center}
    .badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px}
    .badge-green{background:rgba(34,197,94,.15);color:var(--green)}
    .badge-red{background:rgba(239,68,68,.15);color:var(--red)}
    .badge-yellow{background:rgba(245,158,11,.15);color:var(--yellow)}
    .section-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);margin:20px 0 10px}
    .cuenta-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
    .cuenta-item:last-child{border-bottom:none}
    .cuenta-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
    .cuenta-info{flex:1;min-width:0}

    .cuenta-amount{font-size:16px;font-weight:700;text-align:right}
    .cuenta-amount.pos{color:var(--green)}
    .progress-bar{height:4px;border-radius:2px;background:var(--bg3);margin-top:8px;overflow:hidden}
    .progress-fill{height:100%;border-radius:2px;background:var(--accent);transition:width .4s}
    .progress-fill.warn{background:var(--yellow)}
    .progress-fill.danger{background:var(--red)}
    .gasto-item{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--border);position:relative}
    .gasto-item:last-child{border-bottom:none}

    .form-label{font-size:12px;color:var(--text2);font-weight:500;margin-bottom:6px;display:block}
    .form-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);font-size:15px;outline:none;-webkit-appearance:none}
    .form-input:focus{border-color:var(--accent)}
    select.form-input option{background:var(--bg3)}
    .tipo-toggle{display:flex;gap:8px;flex-wrap:wrap}
    .tipo-btn{flex:1;min-width:80px;padding:11px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center}

    .btn-primary{width:100%;padding:15px;border-radius:var(--radius-sm);border:none;background:var(--accent);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px;transition:opacity .2s}

    .chip{padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-size:13px;cursor:pointer;transition:all .15s}

    .ahorro-card{background:linear-gradient(135deg,#1a1f3a,#0f2027);border:1px solid #2a3a5c;border-radius:var(--radius);padding:18px;margin-bottom:12px}

    #toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:10px 20px;border-radius:20px;font-size:13px;z-index:500;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap}

    .edit-toggle{font-size:12px;color:var(--accent);cursor:pointer;font-weight:500}
    .ciclo-badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;background:rgba(108,99,255,.15);color:var(--accent);margin-left:6px}
    ::-webkit-scrollbar{width:0}
  </style>
</head>

<script>
// ─── CONFIG GITHUB (almacenamiento en la nube) ───────────────
const GH_REPO  = 'ferky94/Finanzas';
const GH_FILE  = 'data.json';
const GH_TOKEN = 'REEMPLAZAR_TOKEN'; // se actualiza en runtime

// ─── ESTADO BASE ─────────────────────────────────────────────
const BASE_STATE = {
  debito:[
    {id:'bbva_deb', nombre:'BBVA',              tipo:'debito',emoji:'🏦',color:'#1a3a6b',saldo:0,      reservado:false},
    {id:'hey_deb',  nombre:'HeyBanco',           tipo:'debito',emoji:'💙',color:'#0050ff',saldo:2602.36,reservado:true,notaReservado:'Reservado para pago HeyBanco TDC'},
    {id:'mp_deb',   nombre:'Mercado Pago',        tipo:'debito',emoji:'💳',color:'#00b1ea',saldo:2800.35,reservado:false},
    {id:'sivale_d', nombre:'Si Vale Despensa',    tipo:'vales', emoji:'🛒',color:'#2d7a3a',saldo:3351.00,reservado:false},
    {id:'sivale_r', nombre:'Si Vale Restaurante', tipo:'vales', emoji:'🍽️',color:'#7a2d2d',saldo:4730.00,reservado:false},
  ],
  credito:[
    {id:'bbva_cre', nombre:'BBVA TDC',            emoji:'🏦',color:'#1a3a6b',saldoUsado:6501.36, fechaCorte:7,  proximoPago:6501.36,limite:20000, nota:''},
    {id:'hey_cre',  nombre:'HeyBanco TDC',         emoji:'💙',color:'#0050ff',saldoUsado:2602.33, fechaCorte:25, proximoPago:2602.33,limite:10000, nota:''},
    {id:'mp_cre',   nombre:'Mercado Pago TDC',     emoji:'💳',color:'#00b1ea',saldoUsado:5308.16, fechaCorte:10, proximoPago:2859.76,limite:15000, nota:'Resto $2,448.40 se va a julio'},
    {id:'banorte',  nombre:'Banorte TDC',          emoji:'🔴',color:'#c0392b',saldoUsado:0,        fechaCorte:1,  proximoPago:0,      limite:10000, nota:''},
    {id:'mp_cst',   nombre:'Crédito Sin Tarjeta',  emoji:'🏧',color:'#00856f',saldoUsado:35622.12,fechaCorte:11, proximoPago:2968.51,limite:35622.12,nota:'12 MSI · 1 pago realizado · Próximo 11 jul',esCreditoPersonal:true},
  ],
  ahorro:1000,
  movimientos:[],
  msiActivos:[],
};

let state = JSON.parse(JSON.stringify(BASE_STATE));
let ghFileSha = null; // SHA del data.json en GitHub
let syncOk = false;
let ghToken = '';

// ─── CICLOS DE CORTE ─────────────────────────────────────────
// Dado un timestamp y una tarjeta, devuelve el inicio del ciclo actual
// El ciclo va de (diaCorte+1 del mes anterior) al (diaCorte del mes actual)
function cicloActual(fechaCorte) {
  const hoy = new Date();
  const diaHoy = hoy.getDate();
  let inicio, fin;
  if (diaHoy <= fechaCorte) {
    // Estamos antes o en el día de corte → ciclo: mes anterior día(corte+1) → este mes día(corte)
    const mesAnterior = new Date(hoy.getFullYear(), hoy.getMonth() - 1, fechaCorte + 1);
    inicio = mesAnterior;
    fin = new Date(hoy.getFullYear(), hoy.getMonth(), fechaCorte);
  } else {
    // Ya pasó el corte → ciclo: este mes día(corte+1) → siguiente mes día(corte)
    inicio = new Date(hoy.getFullYear(), hoy.getMonth(), fechaCorte + 1);
    fin = new Date(hoy.getFullYear(), hoy.getMonth() + 1, fechaCorte);
  }
  return { inicio, fin };
}

function esCicloActual(ts, fechaCorte) {
  const { inicio, fin } = cicloActual(fechaCorte);
  const d = new Date(ts);
  return d >= inicio && d <= fin;
}

// ─── GITHUB SYNC ─────────────────────────────────────────────
function setSyncUI(estado) {
  const dot  = document.getElementById('sync-dot');
  const text = document.getElementById('sync-text');
  if (estado === 'ok')      { dot.className='sync-dot';            text.textContent='Sincronizado ✓';  text.style.color='var(--green)'; }
  if (estado === 'syncing') { dot.className='sync-dot syncing';    text.textContent='Guardando...';    text.style.color='var(--yellow)'; }
  if (estado === 'error')   { dot.className='sync-dot error';      text.textContent='Sin conexión (local)'; text.style.color='var(--red)'; }
  if (estado === 'notoken') { dot.className='sync-dot error';      text.textContent='⚙️ Configura tu token'; text.style.color='var(--yellow)'; }
}

async function ghFetch(method, body) {
  const token = ghToken || localStorage.getItem('gh_token');
  if (!token) return null;
  const url = `https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}`;
  const headers = { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' };
  const res = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined });
  if (!res.ok) return null;
  return res.json();
}

async function loadFromGitHub() {
  const token = ghToken || localStorage.getItem('gh_token');
  if (!token) { setSyncUI('notoken'); loadFromLocal(); return; }
  setSyncUI('syncing');
  try {
    const data = await ghFetch('GET');
    if (data && data.content) {
      ghFileSha = data.sha;
      const parsed = JSON.parse(atob(data.content.replace(/\n/g,'')));
      state = parsed;
      localStorage.setItem('finanzas_backup', JSON.stringify(state));
      syncOk = true;
      setSyncUI('ok');
    } else {
      // Archivo no existe aún, usar estado base y crear
      await saveToGitHub();
    }
  } catch(e) {
    setSyncUI('error');
    loadFromLocal();
  }
  render();
}

function loadFromLocal() {
  const backup = localStorage.getItem('finanzas_backup') || localStorage.getItem('finanzas_v2');
  if (backup) { try { state = JSON.parse(backup); } catch(e) {} }
}

async function saveToGitHub() {
  const token = ghToken || localStorage.getItem('gh_token');
  if (!token) { localStorage.setItem('finanzas_backup', JSON.stringify(state)); return; }
  setSyncUI('syncing');
  localStorage.setItem('finanzas_backup', JSON.stringify(state));
  try {
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(state, null, 2))));
    const body = { message: 'Actualización de datos', content, ...(ghFileSha ? { sha: ghFileSha } : {}) };
    const res = await ghFetch('PUT', body);
    if (res && res.content) {
      ghFileSha = res.content.sha;
      setSyncUI('ok');
    } else { setSyncUI('error'); }
  } catch(e) { setSyncUI('error'); }
}

// Alias
function saveState() { saveToGitHub(); }

// ─── TOKEN SETUP ─────────────────────────────────────────────
function promptToken() {
  const t = prompt('Pega tu GitHub Personal Access Token (scope: repo):');
  if (t && t.startsWith('ghp_')) {
    localStorage.setItem('gh_token', t);
    ghToken = t;
    loadFromGitHub();
  }
}

// ─── NAV ─────────────────────────────────────────────────────
let currentTab = 'inicio';
function setTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  render();
}

// ─── HELPERS ─────────────────────────────────────────────────
function fmt(n) { return '$' + Math.abs(n).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}); }

function totalDisponible() {
  return state.debito.filter(c=>!c.reservado).reduce((a,c)=>a+c.saldo,0);
}

// ─── RENDER ──────────────────────────────────────────────────
function render() {
  document.getElementById('total-display').textContent = fmt(totalDisponible());
  document.getElementById('fecha').textContent = new Date().toLocaleDateString('es-MX',{day:'numeric',month:'short'});
  const el = document.getElementById('content');
  if (currentTab==='inicio')       renderInicio(el);
  else if (currentTab==='cuentas') renderCuentas(el);
  else if (currentTab==='movimientos') renderMovimientos(el);
  else if (currentTab==='credito') renderCredito(el);
}

// ─── INICIO ──────────────────────────────────────────────────
function renderInicio(el) {
  const totDebito = state.debito.filter(c=>c.tipo==='debito'&&!c.reservado).reduce((a,c)=>a+c.saldo,0);
  const totVales  = state.debito.filter(c=>c.tipo==='vales').reduce((a,c)=>a+c.saldo,0);
  const totCred   = state.credito.reduce((a,c)=>a+c.proximoPago,0);
  const ultimos   = [...state.movimientos].sort((a,b)=>b.ts-a.ts).slice(0,5);
  el.innerHTML = `
    <div class="totales-grid">
      <div class="total-box"><div class="total-box-label">💳 Débito libre</div><div class="total-box-value" style="color:var(--green)">${fmt(totDebito)}</div></div>
      <div class="total-box"><div class="total-box-label">🛒 Vales</div><div class="total-box-value" style="color:var(--accent2)">${fmt(totVales)}</div></div>
    </div>
    <div class="ahorro-card">
      <div class="ahorro-title">🏦 Ahorro</div>
      <div class="ahorro-value">${fmt(state.ahorro)}</div>
    </div>
    <div class="card">
      <div style="font-size:12px;color:var(--text2);font-weight:500;margin-bottom:6px">💸 Próximos pagos TDC + Crédito</div>
      <div style="font-size:28px;font-weight:700;color:var(--red)">${fmt(totCred)}</div>
      <div style="font-size:11px;color:var(--text3);margin-top:2px">Suma de todos los próximos cortes</div>
    </div>
    <div class="section-title" style="display:flex;justify-content:space-between;align-items:center">
      Últimos movimientos
      ${state.movimientos.length>0?`<span class="edit-toggle" onclick="setTab('movimientos')">Ver todos →</span>`:''}
    </div>
    ${ultimos.length===0
      ?`<div class="empty"><div class="empty-icon">📭</div><div style="font-size:14px;color:var(--text3)">Registra tu primer movimiento con +</div></div>`
      :`<div class="card">${ultimos.map(m=>movItem(m,false)).join('')}</div>`}
  `;
}

// ─── CUENTAS ─────────────────────────────────────────────────
function renderCuentas(el) {
  const debList = state.debito.filter(c=>c.tipo==='debito');
  const valList = state.debito.filter(c=>c.tipo==='vales');
  el.innerHTML = `
    <div class="section-title">Débito</div>
    <div class="card">${debList.map(c=>`
      <div class="cuenta-item">
        <div class="cuenta-icon" style="background:${c.color}22">${c.emoji}</div>
        <div class="cuenta-info">
          <div class="cuenta-name">${c.nombre}</div>
          <div class="cuenta-sub">${c.reservado?'⚠️ Reservado para pago TDC':'Disponible'}</div>
        </div>
        <div class="cuenta-amount ${c.saldo>0?'pos':''}">${fmt(c.saldo)}</div>
      </div>`).join('')}</div>
    <div class="section-title">Vales</div>
    <div class="card">${valList.map(c=>`
      <div class="cuenta-item">
        <div class="cuenta-icon" style="background:${c.color}22">${c.emoji}</div>
        <div class="cuenta-info"><div class="cuenta-name">${c.nombre}</div><div class="cuenta-sub">Saldo de vales</div></div>
        <div class="cuenta-amount pos">${fmt(c.saldo)}</div>
      </div>`).join('')}</div>
    <div class="nota-reservado">ℹ️ HeyBanco Débito está marcado como reservado y no cuenta en tu total disponible.</div>
    <div style="margin-top:16px;text-align:center">
      <span class="edit-toggle" onclick="promptToken()">⚙️ Actualizar token de sincronización</span>
    </div>
  `;
}

// ─── MOVIMIENTOS ─────────────────────────────────────────────
let editMode = false;
function renderMovimientos(el) {
  const movs = [...state.movimientos].sort((a,b)=>b.ts-a.ts);
  el.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div class="section-title" style="margin:0">Movimientos (${movs.length})</div>
      ${movs.length>0?`<span class="edit-toggle" onclick="toggleEdit()">✏️ ${editMode?'Listo':'Editar'}</span>`:''}
    </div>
    ${movs.length===0
      ?`<div class="empty"><div class="empty-icon">📭</div><div style="font-size:14px">Registra tu primer movimiento con +</div></div>`
      :`<div class="card">${movs.map(m=>movItem(m,editMode)).join('')}</div>`}
  `;
}

function toggleEdit() { editMode=!editMode; render(); }

function movItem(m, withDelete) {
  const cuenta = [...state.debito,...state.credito].find(c=>c.id===m.cuentaId);
  const nombre = cuenta ? cuenta.nombre : (m.cuentaId==='ahorro'?'Ahorro':m.cuentaId);
  const fecha  = new Date(m.ts).toLocaleDateString('es-MX',{day:'numeric',month:'short'});
  const msiTag = m.tipoPago==='msi'?` · ${m.msi}MSI`:'';
  const notaTag = m.nota?` · 📝 ${m.nota}`:'';
  const esIngreso = m.tipo==='ingreso';
  const esPago    = m.tipo==='pago';
  const amtClass  = esPago?'pago':esIngreso?'income':'credit';
  const prefix    = esPago?'↩ ':esIngreso?'+':'-';
  const icon      = esPago?'✅':m.categoria?m.categoria.split(' ')[0]:'💸';
  const iconBg    = esPago?'rgba(78,205,196,.15)':esIngreso?'rgba(34,197,94,.15)':'rgba(239,68,68,.1)';
  return `
    <div class="gasto-item ${withDelete?'editing':''}" id="mov-${m.id}">
      <div class="gasto-icon" style="background:${iconBg}">${icon}</div>
      <div class="gasto-info">
        <div class="gasto-desc">${m.descripcion}</div>
        <div class="gasto-meta">${fecha} · ${nombre}${msiTag}${notaTag}</div>
      </div>
      <div class="gasto-amount ${amtClass}">${prefix}${fmt(m.monto)}</div>
      ${withDelete?`<button class="delete-btn" onclick="borrarMovimiento('${m.id}')">✕</button>`:''}
    </div>`;
}

// ─── TDC ─────────────────────────────────────────────────────

    const pct = Math.min(100,Math.round((c.saldoUsado/c.limite)*100));
    const fillClass = pct>80?'danger':pct>50?'warn':'';
    const msiDe = state.msiActivos.filter(m=>m.cuentaId===c.id&&m.mesesRestantes>0);
    const totalMSI = msiDe.reduce((a,m)=>a+m.abonoPorMes,0);
    const { inicio, fin } = cicloActual(c.fechaCorte);
    const cicloStr = `${inicio.toLocaleDateString('es-MX',{day:'numeric',month:'short'})} – ${fin.toLocaleDateString('es-MX',{day:'numeric',month:'short'})}`;

    if (c.esCreditoPersonal) {
      const pagosHechos = state.movimientos.filter(m=>m.tipo==='pago'&&m.cuentaId===c.id).length + 1;
      const pagosRestantes = 12 - pagosHechos;
      return `<div class="card" style="margin-bottom:12px;border-color:#00856f44">
        <div class="card-row" style="margin-bottom:12px">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="width:40px;height:40px;border-radius:12px;background:#00856f22;display:flex;align-items:center;justify-content:center;font-size:18px">${c.emoji}</div>
            <div><div style="font-size:15px;font-weight:700">${c.nombre}</div><div style="font-size:11px;color:#00b894">Mercado Pago · Pago día ${c.fechaCorte}</div></div>
          </div>
          <span class="badge" style="background:#00856f22;color:#00b894">12 MSI</span>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
          <div><div style="font-size:11px;color:var(--text3)">Saldo restante</div><div style="font-size:18px;font-weight:700;color:var(--red)">${fmt(c.saldoUsado)}</div></div>
          <div><div style="font-size:11px;color:var(--text3)">Próximo pago</div><div style="font-size:18px;font-weight:700;color:var(--yellow)">${fmt(c.proximoPago)}</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${Math.round((pagosHechos/12)*100)}%;background:#00b894"></div></div>
        <div style="font-size:10px;color:var(--text3);margin-top:6px">${pagosHechos} de 12 pagos · ${pagosRestantes} restantes · ${fmt(c.proximoPago)}/mes</div>
        ${c.nota?`<div style="margin-top:6px;font-size:11px;color:#00b894;opacity:.8">ℹ️ ${c.nota}</div>`:''}
      </div>`;
    }

    return `<div class="card" style="margin-bottom:12px">
      <div class="card-row" style="margin-bottom:12px">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:40px;height:40px;border-radius:12px;background:${c.color}22;display:flex;align-items:center;justify-content:center;font-size:18px">${c.emoji}</div>
          <div>
            <div style="font-size:15px;font-weight:700">${c.nombre}</div>
            <div style="font-size:11px;color:var(--text3)">Corte día ${c.fechaCorte} <span class="ciclo-badge">${cicloStr}</span></div>
          </div>
        </div>
        <span class="badge ${pct>80?'badge-red':pct>50?'badge-yellow':'badge-green'}">${pct}%</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
        <div><div style="font-size:11px;color:var(--text3)">Saldo usado</div><div style="font-size:18px;font-weight:700;color:var(--red)">${fmt(c.saldoUsado)}</div></div>
        <div><div style="font-size:11px;color:var(--text3)">Próximo pago</div><div style="font-size:18px;font-weight:700;color:var(--yellow)">${fmt(c.proximoPago)}</div></div>
      </div>
      <div class="progress-bar"><div class="progress-fill ${fillClass}" style="width:${pct}%"></div></div>
      <div style="font-size:10px;color:var(--text3);margin-top:6px">Límite ${fmt(c.limite)}</div>
      ${c.nota?`<div style="margin-top:6px;font-size:11px;color:var(--text3)">ℹ️ ${c.nota}</div>`:''}
      ${msiDe.length>0?`<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border)">
        <div style="font-size:11px;color:var(--accent);margin-bottom:6px">MSI activos (${fmt(totalMSI)}/mes)</div>
        ${msiDe.map(m=>`<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0"><span style="color:var(--text2)">${m.descripcion} · ${m.mesesRestantes}/${m.meses} meses</span><span style="color:var(--accent)">${fmt(m.abonoPorMes)}/mes</span></div>`).join('')}

// ─── MODAL ───────────────────────────────────────────────────
let modalTipo='gasto', modalPago='contado', modalMSI=null, modalCat='🛒 Compras';

function openModal() {
  modalTipo='gasto'; modalPago='contado'; modalMSI=null; modalCat='🛒 Compras';
  document.getElementById('inp-desc').value='';
  document.getElementById('inp-monto').value='';
  document.getElementById('inp-nota').value='';
  ['btn-gasto','btn-pago','btn-ingreso'].forEach(id=>document.getElementById(id).classList.remove('active'));
  document.getElementById('btn-gasto').classList.add('active');
  document.getElementById('pago-row').style.display='block';
  document.getElementById('msi-row').classList.remove('show');
  document.getElementById('cat-row').style.display='block';
  poblarSelectCuentas();
  setPago('contado');
  setCat('🛒 Compras');
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('inp-desc').focus(),350);
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }

document.getElementById('modal').addEventListener('click',function(e){ if(e.target===this) closeModal(); });

function setTipo(t) {
  modalTipo=t;
  ['btn-gasto','btn-pago','btn-ingreso'].forEach(id=>document.getElementById(id).classList.remove('active'));
  const activeId = t==='gasto'?'btn-gasto':t==='pago'?'btn-pago':'btn-ingreso';
  document.getElementById(activeId).classList.add('active');
  document.getElementById(activeId).classList.add(t==='pago'?'tpago':t==='ingreso'?'tingreso':'');
  document.getElementById('pago-row').style.display = t==='gasto'?'block':'none';
  document.getElementById('msi-row').classList.remove('show');
  document.getElementById('cat-row').style.display = t==='pago'?'none':'block';
  document.getElementById('label-cuenta').textContent = t==='ingreso'?'¿Dónde te cayó?':t==='pago'?'¿Qué TDC pagaste?':'Tarjeta / Cuenta';
  poblarSelectCuentas();
}

function poblarSelectCuentas() {
  const sel=document.getElementById('sel-cuenta');
  sel.innerHTML='';
  if (modalTipo==='pago') {
    state.credito.forEach(c=>{
      const o=document.createElement('option'); o.value=c.id; o.textContent=c.nombre; sel.appendChild(o);
    });
  } else if (modalTipo==='gasto') {
    state.credito.forEach(c=>{
      const o=document.createElement('option'); o.value=c.id; o.textContent=c.esCreditoPersonal?'🏧 '+c.nombre+' (MP)':c.nombre; sel.appendChild(o);
    });
    state.debito.forEach(c=>{
      const o=document.createElement('option'); o.value=c.id; o.textContent=c.nombre+(c.tipo==='vales'?' (Vales)':''); sel.appendChild(o);
    });
  } else {
    const oAhorro=document.createElement('option'); oAhorro.value='ahorro'; oAhorro.textContent='🏦 Ahorro'; sel.appendChild(oAhorro);
    state.debito.forEach(c=>{
      const o=document.createElement('option'); o.value=c.id; o.textContent=c.nombre+(c.tipo==='vales'?' (Vales)':''); sel.appendChild(o);
    });
  }
  onCuentaChange();
}

function onCuentaChange() {
  if (modalTipo!=='gasto') return;
  const cid=document.getElementById('sel-cuenta').value;
  const esCredito=state.credito.some(c=>c.id===cid);
  document.getElementById('pago-row').style.display=esCredito?'block':'none';
  if (!esCredito) { document.getElementById('msi-row').classList.remove('show'); modalPago='contado'; }
}

function setPago(p) {
  modalPago=p;
  document.querySelectorAll('#chips-pago .chip').forEach(c=>c.classList.toggle('active',c.textContent.toLowerCase()===p));
  document.getElementById('msi-row').classList.toggle('show',p==='msi');
  if (p==='contado') modalMSI=null;
}

function setMSI(n) {
  modalMSI=n;
  document.querySelectorAll('#msi-row .chip').forEach(c=>c.classList.toggle('active',c.textContent===n+' MSI'));
}

function setCat(cat) {
  modalCat=cat;
  document.querySelectorAll('#chips-cat .chip').forEach(c=>c.classList.toggle('active',c.textContent===cat));
}

// ─── GUARDAR ─────────────────────────────────────────────────
function guardarMovimiento() {
  const desc  = document.getElementById('inp-desc').value.trim();
  const monto = parseFloat(document.getElementById('inp-monto').value);
  const cid   = document.getElementById('sel-cuenta').value;
  const nota  = document.getElementById('inp-nota').value.trim();

  if (!desc)             { toast('Escribe una descripción'); return; }
  if (!monto||monto<=0)  { toast('Ingresa un monto válido'); return; }
  if (modalPago==='msi'&&!modalMSI) { toast('Selecciona los meses de MSI'); return; }

  const id  = Date.now().toString();
  const mov = { id, descripcion:desc, monto, cuentaId:cid, tipo:modalTipo,
                tipoPago:modalPago, msi:modalMSI, categoria:modalCat, nota, ts:Date.now() };
  state.movimientos.push(mov);

  if (modalTipo==='pago') {
    // ── PAGO DE TDC ──────────────────────────────────────────
    const cred = state.credito.find(c=>c.id===cid);
    if (cred) {
      cred.saldoUsado    = Math.max(0, cred.saldoUsado - monto);
      cred.proximoPago   = Math.max(0, cred.proximoPago - monto);
    }

  } else if (modalTipo==='gasto') {
    const cred = state.credito.find(c=>c.id===cid);
    if (cred) {
      // Solo sumar al proximoPago si el gasto cae en el ciclo ACTUAL
      if (esCicloActual(mov.ts, cred.fechaCorte)) {
        cred.saldoUsado += monto;
        if (modalPago==='contado') {
          cred.proximoPago += monto;
        } else if (modalPago==='msi') {
          const abono = monto / modalMSI;
          cred.proximoPago += abono;
          state.msiActivos.push({ id, descripcion:desc, cuentaId:cid, total:monto,
            meses:modalMSI, mesesRestantes:modalMSI, abonoPorMes:abono, fechaInicio:Date.now() });
        }
      } else {
        // Gasto fuera del ciclo actual → solo suma saldo, no próximo pago
        cred.saldoUsado += monto;
        toast('ℹ️ Gasto fuera del ciclo actual, se suma al siguiente corte');
      }
    } else {
      const deb = state.debito.find(c=>c.id===cid);
      if (deb) deb.saldo = Math.max(0, deb.saldo - monto);
    }

  } else {
    // INGRESO
    if (cid==='ahorro') { state.ahorro += monto; }
    else { const deb=state.debito.find(c=>c.id===cid); if(deb) deb.saldo+=monto; }
  }

  saveState();
  closeModal();
  const msgs = { gasto:'✅ Gasto registrado', pago:'✅ Pago registrado', ingreso:'✅ Ingreso registrado' };
  toast(msgs[modalTipo]);
  editMode=false;
  render();
}

// ─── BORRAR ──────────────────────────────────────────────────
function borrarMovimiento(id) {
  const mov = state.movimientos.find(m=>m.id===id);
  if (!mov) return;

  if (mov.tipo==='pago') {
    const cred=state.credito.find(c=>c.id===mov.cuentaId);
    if (cred) { cred.saldoUsado+=mov.monto; cred.proximoPago+=mov.monto; }

  } else if (mov.tipo==='gasto') {
    const cred=state.credito.find(c=>c.id===mov.cuentaId);
    if (cred) {
      cred.saldoUsado=Math.max(0,cred.saldoUsado-mov.monto);
      if (mov.tipoPago==='contado') {
        if (esCicloActual(mov.ts,cred.fechaCorte)) cred.proximoPago=Math.max(0,cred.proximoPago-mov.monto);
      } else if (mov.tipoPago==='msi') {
        const idx=state.msiActivos.findIndex(m=>m.id===id);
        if (idx!==-1) { cred.proximoPago=Math.max(0,cred.proximoPago-state.msiActivos[idx].abonoPorMes); state.msiActivos.splice(idx,1); }
      }
    } else {
      const deb=state.debito.find(c=>c.id===mov.cuentaId); if(deb) deb.saldo+=mov.monto;
    }
  } else {
    if (mov.cuentaId==='ahorro') { state.ahorro=Math.max(0,state.ahorro-mov.monto); }
    else { const deb=state.debito.find(c=>c.id===mov.cuentaId); if(deb) deb.saldo=Math.max(0,deb.saldo-mov.monto); }
  }

  state.movimientos=state.movimientos.filter(m=>m.id!==id);
  saveState();
  toast('🗑️ Movimiento eliminado');
  render();
}

// ─── TOAST ───────────────────────────────────────────────────
function toast(msg) {
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// ─── INIT ────────────────────────────────────────────────────
const savedToken = localStorage.getItem('gh_token');
if (savedToken) { ghToken = savedToken; }
loadFromGitHub();
